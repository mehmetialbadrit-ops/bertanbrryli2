<!DOCTYPE html>
<html>
<head>
    <title>Person Object</title>
</head>
<body>

    <script>
        const person = {
            firstName: "John",
            lastName: "Doe",
            age: 25,

            fullName: function() {
                return this.firstName + " " + this.lastName;
            }
        };

        document.write("Full Name: " + person.fullName());
        document.write("<br>Age: " + person.age);
    </script>

</body>
</html>
